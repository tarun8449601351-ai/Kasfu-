<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>NUMBER STREAKS 💫</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    background:#000;
}

body{
    margin:0;
    min-height:100vh;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow-x:hidden;
}

/* PHONE FRAME */
.page{
    position:relative;

    width:100%;
    max-width:430px;

    min-height:100vh;
    height:auto;

    background:#030303;

    padding:28px 22px 32px;

    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;

    border-radius:38px;

    border:1px solid rgba(255,215,0,.28);

    box-shadow:
        0 0 20px rgba(255,215,0,.15),
        inset 0 0 35px rgba(255,215,0,.035);
}

/* DESKTOP PHONE SIZE */
@media(min-width:500px){

    body{
        padding:20px;
    }

    .page{
        width:390px;
        min-height:844px;
        height:844px;

        border-radius:42px;

        box-shadow:
            0 0 30px rgba(255,215,0,.18),
            inset 0 0 40px rgba(255,215,0,.04);
    }
}

/* LOGO */
.logo{
    width:255px;
    height:255px;

    margin-top:28px;

    border-radius:50%;

    object-fit:cover;

    border:6px solid #ffd92e;

    box-shadow:
        0 0 15px #ffd92e,
        0 0 40px rgba(255,217,46,.5),
        0 0 70px rgba(255,217,46,.22);
}

/* HEADLINE */
h1{
    margin-top:42px;

    color:#fff;

    font-size:38px;
    line-height:1.05;

    font-weight:900;

    letter-spacing:-1px;

    white-space:nowrap;

    text-shadow:
        0 3px 12px rgba(255,255,255,.15);
}

/* DESCRIPTION */
.subtitle{
    margin-top:54px;

    color:#ffd928;

    font-size:20px;

    line-height:1.55;

    font-weight:500;
}

/* TELEGRAM BUTTON */
.join-btn{
    width:100%;
    max-width:335px;

    margin-top:45px;

    padding:25px 10px;

    border-radius:55px;

    background:
        linear-gradient(
            135deg,
            #e5bc25,
            #fff08a,
            #e4bd27
        );

    color:#111;

    font-size:21px;

    font-weight:800;

    text-decoration:none;

    display:block;

    box-shadow:
        0 0 15px rgba(255,215,0,.5),
        0 0 40px rgba(255,215,0,.28);

    animation:pulse 2s infinite;

    transition:.2s;
}

.join-btn:active{
    transform:scale(.96);
}

/* COMMUNITY */
.community{
    margin-top:48px;

    color:#ffd928;

    font-size:20px;

    font-weight:800;
}

/* BOTTOM */
.bottom{
    margin-top:42px;

    color:#777;

    font-size:15px;

    letter-spacing:1px;

    line-height:1.5;

    white-space:nowrap;
}

/* GLOW ANIMATION */
@keyframes pulse{

    0%,100%{
        box-shadow:
            0 0 15px rgba(255,215,0,.45),
            0 0 35px rgba(255,215,0,.22);
    }

    50%{
        box-shadow:
            0 0 25px rgba(255,215,0,.8),
            0 0 55px rgba(255,215,0,.38);
    }
}

/* SMALL PHONES */
@media(max-width:360px){

    .page{
        padding-left:16px;
        padding-right:16px;
    }

    .logo{
        width:220px;
        height:220px;
    }

    h1{
        font-size:32px;
    }

    .subtitle{
        font-size:18px;
    }

    .join-btn{
        font-size:19px;
    }

    .community{
        font-size:18px;
    }

    .bottom{
        font-size:13px;
    }
}
</style>
</head>

<body>

<div class="page">

    <img
        class="logo"
        src="https://d1yei2z3i6k35z.cloudfront.net/9021055/6a7d8305238c63.05122011_172.jpg"
        alt="Number Streaks"
    >

    <h1>NUMBER STREAKS 💫</h1>

    <div class="subtitle">
        Join the official Telegram channel for<br>
        updates.
    </div>

    <a
        class="join-btn"
        href="https://t.me/+OCYNS4oIIAQ0ZDE1"
        target="_blank"
        rel="noopener noreferrer"
    >
        🚀 Join Telegram Now 🚀
    </a>

    <div class="community">
        ⭐ Active Telegram Community
    </div>

    <div class="bottom">
        100% FREE | NO SPAM | INSTANT UPDATES
    </div>

</div>

</body>
</html>
