<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NUMBER STREAKS 💫</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow-x:hidden;
}

.page{
    width:100%;
    max-width:430px;
    min-height:100vh;
    padding:35px 24px 40px;
    background:#030303;
    border:1px solid rgba(255,215,0,.35);
    border-radius:45px;
    box-shadow:
        0 0 25px rgba(255,215,0,.18),
        inset 0 0 35px rgba(255,215,0,.04);
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
}

/* IMAGE */
.logo{
    width:270px;
    height:270px;
    object-fit:cover;
    border-radius:50%;
    border:7px solid #ffd92e;
    margin-top:30px;
    box-shadow:
        0 0 15px #ffd92e,
        0 0 45px rgba(255,217,46,.55),
        0 0 80px rgba(255,217,46,.25);
}

/* HEADLINE */
h1{
    margin-top:58px;
    color:#fff;
    font-size:42px;
    line-height:1.08;
    font-weight:900;
    letter-spacing:-1px;
    text-shadow:0 3px 12px rgba(255,255,255,.15);
}

/* SUBTEXT */
.subtitle{
    margin-top:65px;
    color:#ffd928;
    font-size:22px;
    line-height:1.5;
    font-weight:500;
}

/* BUTTON */
.join-btn{
    width:100%;
    max-width:350px;
    margin-top:55px;
    padding:27px 15px;
    border:none;
    border-radius:60px;
    background:linear-gradient(135deg,#e6bd28,#fff08a,#e4bd27);
    color:#111;
    font-size:23px;
    font-weight:800;
    text-decoration:none;
    display:block;
    box-shadow:
        0 0 15px rgba(255,215,0,.5),
        0 0 40px rgba(255,215,0,.3);
    transition:.25s;
    animation:pulse 2s infinite;
}

.join-btn:active{
    transform:scale(.96);
}

.join-btn:hover{
    transform:scale(1.03);
}

/* COMMUNITY */
.community{
    margin-top:65px;
    color:#ffd928;
    font-size:22px;
    font-weight:800;
}

/* BOTTOM TEXT */
.bottom{
    margin-top:58px;
    color:#777;
    font-size:17px;
    letter-spacing:1px;
    line-height:1.5;
}

/* BUTTON ANIMATION */
@keyframes pulse{
    0%,100%{
        box-shadow:
        0 0 15px rgba(255,215,0,.45),
        0 0 35px rgba(255,215,0,.25);
    }
    50%{
        box-shadow:
        0 0 25px rgba(255,215,0,.8),
        0 0 60px rgba(255,215,0,.4);
    }
}

/* MOBILE */
@media(max-width:430px){
    .page{
        border-radius:35px;
        padding-left:22px;
        padding-right:22px;
    }

    .logo{
        width:260px;
        height:260px;
    }

    h1{
        font-size:40px;
    }
}
</style>
</head>

<body>

<div class="page">

    <img
        class="logo"
        src="https://d1yei2z3i6k35z.cloudfront.net/9021055/6a7d8305238c63.05122011_172.jpg"
        alt="Number Streaks"
    >

    <h1>
        NUMBER STREAKS 💫
    </h1>

    <div class="subtitle">
        Join the official Telegram channel for<br>
        updates.
    </div>

    <a
        class="join-btn"
        href="https://t.me/+OCYNS4oIIAQ0ZDE1"
        target="_blank"
        rel="noopener noreferrer"
    >
        🚀 Join Telegram Now 🚀
    </a>

    <div class="community">
        ⭐ Active Telegram Community
    </div>

    <div class="bottom">
        100% FREE | NO SPAM | INSTANT UPDATES
    </div>

</div>

</body>
</html>
