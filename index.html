<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>NUMBER STREAKS 💫</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#000;
    font-family:Arial, Helvetica, sans-serif;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:10px;

    overflow:hidden;
}


/* =========================
   PHONE FRAME
========================= */

.page{
    width:100%;
    max-width:340px;
    height:650px;

    background:#030303;

    border:1px solid rgba(255,215,0,.30);
    border-radius:30px;

    padding:20px 18px;

    display:flex;
    flex-direction:column;
    align-items:center;

    text-align:center;

    overflow:hidden;

    box-shadow:
        0 0 20px rgba(255,215,0,.15),
        inset 0 0 25px rgba(255,215,0,.035);
}


/* =========================
   PROFILE IMAGE
========================= */

.logo{
    width:175px;
    height:175px;

    margin-top:10px;

    object-fit:cover;

    border-radius:50%;

    border:5px solid #ffd92e;

    box-shadow:
        0 0 12px #ffd92e,
        0 0 30px rgba(255,217,46,.50),
        0 0 55px rgba(255,217,46,.20);
}


/* =========================
   HEADLINE
========================= */

h1{
    margin-top:24px;

    color:#fff;

    font-size:29px;

    line-height:1.1;

    font-weight:900;

    letter-spacing:-.5px;

    white-space:nowrap;

    text-shadow:
        0 3px 12px rgba(255,255,255,.12);
}


/* =========================
   SUBTITLE
========================= */

.subtitle{
    margin-top:25px;

    color:#ffd928;

    font-size:16px;

    line-height:1.45;

    font-weight:500;
}


/* =========================
   TELEGRAM BUTTON
========================= */

.join-btn{
    width:100%;
    max-width:285px;

    margin-top:27px;

    padding:18px 8px;

    border-radius:50px;

    background:
        linear-gradient(
            135deg,
            #e3ba25,
            #fff08a,
            #e3ba25
        );

    color:#111;

    font-size:17px;

    font-weight:800;

    text-decoration:none;

    display:block;

    box-shadow:
        0 0 12px rgba(255,215,0,.45),
        0 0 28px rgba(255,215,0,.22);

    animation:pulse 2s infinite;

    transition:.2s;
}

.join-btn:hover{
    transform:scale(1.03);
}

.join-btn:active{
    transform:scale(.96);
}


/* =========================
   COMMUNITY TEXT
========================= */

.community{
    margin-top:28px;

    color:#ffd928;

    font-size:16px;

    line-height:1.3;

    font-weight:800;
}


/* =========================
   BOTTOM TEXT
========================= */

.bottom{
    margin-top:22px;

    color:#707070;

    font-size:11px;

    letter-spacing:.7px;

    line-height:1.4;

    white-space:nowrap;
}


/* =========================
   BUTTON GLOW
========================= */

@keyframes pulse{

    0%,
    100%{
        box-shadow:
            0 0 12px rgba(255,215,0,.40),
            0 0 25px rgba(255,215,0,.20);
    }

    50%{
        box-shadow:
            0 0 20px rgba(255,215,0,.75),
            0 0 40px rgba(255,215,0,.30);
    }

}


/* =========================
   SMALL MOBILE
========================= */

@media(max-width:360px){

    body{
        padding:5px;
    }

    .page{
        width:320px;
        height:620px;

        padding:16px 15px;

        border-radius:28px;
    }

    .logo{
        width:160px;
        height:160px;

        margin-top:8px;
    }

    h1{
        margin-top:21px;
        font-size:27px;
    }

    .subtitle{
        margin-top:22px;
        font-size:15px;
    }

    .join-btn{
        margin-top:24px;
        padding:17px 6px;
        font-size:16px;
    }

    .community{
        margin-top:25px;
        font-size:15px;
    }

    .bottom{
        margin-top:19px;
        font-size:10px;
    }

}

</style>

<body>

<div class="page">

    <!-- IMAGE -->
    <img
        class="logo"
        src="https://d1yei2z3i6k35z.cloudfront.net/9021055/6a7d8305238c63.05122011_172.jpg"
        alt="Number Streaks"
    >


    <!-- HEADLINE -->
    <h1>

    </h1>


    <!-- SUBTITLE -->
    <div class="subtitle">
        Join the official Telegram channel for<br>

    </div>


    <!-- TELEGRAM BUTTON -->
    <a
        class="join-btn"
        href="https://t.me/+OCYNS4oIIAQ0ZDE1"

        rel="noopener noreferrer"
    >
        🚀 Join Telegram Now 🚀
    </a>


    <!-- COMMUNITY -->
    <div class="community">

    </div>
