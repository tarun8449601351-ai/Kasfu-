<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NUMBER STREAKS 💫</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    background:#000;
    font-family:Arial,Helvetica,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;
    padding:15px;

    overflow:hidden;
}

/* MAIN PHONE FRAME */
.page{
    width:100%;
    max-width:340px;
    height:740px;

    background:#030303;

    border-radius:32px;
    border:1px solid rgba(255,215,0,.30);

    box-shadow:
        0 0 20px rgba(255,215,0,.15),
        inset 0 0 25px rgba(255,215,0,.035);

    display:flex;
    flex-direction:column;
    align-items:center;

    text-align:center;

    padding:25px 18px;

    overflow:hidden;
}

/* IMAGE */
.logo{
    width:190px;
    height:190px;

    margin-top:18px;

    object-fit:cover;
    border-radius:50%;

    border:5px solid #ffd92e;

    box-shadow:
        0 0 12px #ffd92e,
        0 0 30px rgba(255,217,46,.50);
}

/* HEADLINE */
h1{
    margin-top:32px;

    color:#fff;

    font-size:30px;
    font-weight:900;

    line-height:1.1;

    white-space:nowrap;
}

/* SUBTITLE */
.subtitle{
    margin-top:35px;

    color:#ffd928;

    font-size:16px;

    line-height:1.45;
}

/* BUTTON */
.join-btn{
    width:100%;
    max-width:285px;

    margin-top:35px;

    padding:20px 8px;

    border-radius:50px;

    background:
        linear-gradient(
            135deg,
            #e3ba25,
            #fff08a,
            #e3ba25
        );

    color:#111;

    font-size:17px;
    font-weight:800;

    text-decoration:none;

    box-shadow:
        0 0 15px rgba(255,215,0,.45),
        0 0 30px rgba(255,215,0,.22);

    animation:pulse 2s infinite;
}

/* COMMUNITY */
.community{
    margin-top:38px;

    color:#ffd928;

    font-size:17px;

    font-weight:800;
}

/* BOTTOM TEXT */
.bottom{
    margin-top:34px;

    color:#707070;

    font-size:12px;

    letter-spacing:.7px;

    white-space:nowrap;
}

/* ANIMATION */
@keyframes pulse{
    0%,100%{
        box-shadow:
        0 0 12px rgba(255,215,0,.4),
        0 0 25px rgba(255,215,0,.2);
    }

    50%{
        box-shadow:
        0 0 20px rgba(255,215,0,.75),
        0 0 40px rgba(255,215,0,.3);
    }
}

/* MOBILE */
@media(max-width:380px){

    body{
        padding:8px;
    }

    .page{
        width:320px;
        height:700px;

        padding:20px 16px;
        border-radius:30px;
    }

    .logo{
        width:170px;
        height:170px;
    }

    h1{
        font-size:27px;
        margin-top:27px;
    }

    .subtitle{
        margin-top:30px;
        font-size:15px;
    }

    .join-btn{
        margin-top:30px;
        padding:18px 6px;
        font-size:16px;
    }

    .community{
        margin-top:32px;
        font-size:16px;
    }

    .bottom{
        margin-top:28px;
        font-size:11px;
    }
}
</style>
</head>

<body>

<div class="page">

    <img
        class="logo"
        src="https://d1yei2z3i6k35z.cloudfront.net/9021055/6a7d8305238c63.05122011_172.jpg"
        alt="Number Streaks"
    >

    <h1>NUMBER STREAKS 💫</h1>

    <div class="subtitle">
        Join the official Telegram channel for<br>
        updates.
    </div>

    <a
        class="join-btn"
        href="https://t.me/+OCYNS4oIIAQ0ZDE1"
        target="_blank"
        rel="noopener noreferrer"
    >
        🚀 Join Telegram Now 🚀
    </a>

    <div class="community">
        ⭐ Active Telegram Community
    </div>

    <div class="bottom">
        100% FREE | NO SPAM | INSTANT UPDATES
    </div>

</div>

</body>
</html>
